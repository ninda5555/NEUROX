# NSE Trading Assistant — configuration template.
# Copy to config.yaml and fill in credentials. config.yaml is gitignored;
# credentials never go in code, logs, or the DB (CLAUDE.md §12).

fyers:
  app_id: ""             # Fyers App ID, e.g. XXXXXXXXX-100
  secret_key: ""         # Fyers app Secret Key
  redirect_uri: "https://127.0.0.1"
  fyers_id: ""           # Fyers client/login id (optional, for TOTP-assisted login)
  totp_secret: ""        # optional TOTP seed; used only to print the current code
                          # (or, if auto_login is on, to complete the daily login)
  log_dir: "fyers_logs"
  # --- unattended cloud deployment only (SETUP.md "Run on a cloud server") ---
  auto_login: false      # SECURITY TRADE-OFF, off by default — see SETUP.md.
                          # true = a 06:00 IST job completes the daily SEBI
                          # re-auth headlessly using totp_secret + pin below.
                          # false (default) = today's manual paste-the-URL flow.
  pin: ""                # Fyers PIN — only read when auto_login: true

paths:
  db: "data/app.db"
  candles: "data/candles"
  features: "data/features"
  models: "models"
  tokens: ".tokens"
  surveillance_cache: "data/surveillance"

universe:                 # CLAUDE.md §4
  min_turnover_cr: 5.0    # median daily turnover over rolling 20 sessions, ₹ crore
  min_price: 20.0         # penny-stock guard
  min_listed_sessions: 60
  min_nonzero_vol_sessions: 18   # of the last 20 sessions
  exclude_gsm_all: true          # every GSM stage excluded
  exclude_asm_min_stage: 1       # ASM (ST & LT) stage >= this excluded
  surveillance_lookback_days: 7  # how far back to search for the latest REG_IND file

backfill:                 # CLAUDE.md §3.3: 5-min max 100 days/request, daily max 366
  daily_days: 730
  fivemin_days: 120

labels:                   # CLAUDE.md §5
  min_barrier_atr_pct: 0.30   # floor intraday barrier/stop ATR at 0.30% of price

training:                 # CLAUDE.md §6.2, deploy/ scheduler
  retrain_schedule: "weekly"  # "weekly" (Sat 10:00 IST, default) or "daily"
                               # (~16:45 IST Mon-Fri, after the candle top-up)
  time_decay_half_life_days: 0   # T9, OFF: >0 halves a training sample's
                                  # weight per N days of age (e.g. 60)
  swing_uniqueness_weights: false  # T9, OFF: down-weight overlapping swing
                                    # labels (1/overlap, Lopez de Prado)
  ensemble_size: 1        # T10, OFF at 1: >1 trains seed-bagged members;
                           # score = member mean, member spread logged as
                           # model-uncertainty (retrain time scales ~linearly)
  meta_labeling: false    # T11, OFF: second model scores whether the
                           # primary's call pays (raw score + context);
                           # calibration then runs on the meta's output.
                           # Prior-fold OOF uplift reported in cv_report.meta

backup:                   # T16: nightly journal-DB snapshot (21:30 IST)
  enabled: true           # online backup -> integrity check -> gzip -> prune
  dir: "data/backups"
  keep_days: 14

security:                 # CLAUDE.md §12
  require_tailscale_identity: false  # T13, OFF: when true, every request must
                                      # carry a Tailscale-User-Login header
                                      # (only `tailscale serve` on 127.0.0.1
                                      # sets it — unspoofable off-tailnet).
                                      # Hardening headers are always on.
  allowed_logins: []      # [] = any tailnet identity; else an allowlist,
                           #      e.g. ["you@gmail.com"] (multi-user)

observability:
  score_log: true         # log EVERY scored candidate (not just emitted
                           # signals) to data/scores/{mode}/{date}.parquet —
                           # feeds drift monitoring; ~a few MB/day. Kill
                           # switch only; scans never fail on a log error.
  psi_window_days: 5      # live window compared against the training baseline
  psi_flag_threshold: 0.25  # PSI above this => feature-drift red flag (T7)

signals:                  # CLAUDE.md §6.3
  confidence_threshold: 0.60
  scanner_top_n: 12
  regime_threshold_bump:  # T12, OFF at all-zero: extra confidence demanded
    hv_bn: 0.0            # per regime bucket (high/low VIX x breadth +/-).
    hv_bp: 0.0            # e.g. hv_bn: 0.05 -> 0.65 needed in a high-VIX,
    lv_bn: 0.0            # negative-breadth tape. Active bumps are shown in
    lv_bp: 0.0            # the status banner and on each signal's flags.
    unknown: 0.0

risk:                     # CLAUDE.md §7
  capital: 1000000        # ₹ paper capital
  intraday_risk_pct: 1.0
  swing_risk_pct: 1.5
  max_position_notional_pct: 20.0
  daily_loss_limit_pct: 3.0
  loss_limit_warn_frac: 0.75
  min_stop_to_cost: 5.0      # skip setups whose stop is < 5× round-trip cost (§7)

costs:                    # CLAUDE.md §13
  per_side_pct: 0.05      # brokerage + STT + slippage estimate, per side
